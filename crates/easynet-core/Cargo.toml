[package]
name = "easynet-core"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = "2"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
x25519-dalek = { version = "2", features = ["static_secrets"] }
